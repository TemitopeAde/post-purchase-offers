<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Promotional banner, 540 x 360. Wix rules: colorful background, no text, no logo. -->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 540px; height: 360px; overflow: hidden; }
  body { background: #116dff; position: relative; }
  .glow { position: absolute; border-radius: 50%; }
  .g1 { width: 380px; height: 380px; left: -120px; top: -160px; background: #3d8bff; }
  .g2 { width: 300px; height: 300px; right: -90px; bottom: -150px; background: #0a55d6; }
  .receipt { position: absolute; left: 62px; top: 70px; width: 150px; height: 210px; background: #fff; border-radius: 12px; padding: 18px 16px; box-shadow: 0 16px 40px rgba(0, 20, 80, 0.3); transform: rotate(-6deg); }
  .check { width: 44px; height: 44px; border-radius: 50%; background: #25a55a; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
  .bar { height: 8px; border-radius: 4px; background: #e4e9f2; margin-bottom: 10px; }
  .card { position: absolute; width: 132px; height: 186px; background: #fff; border-radius: 12px; padding: 10px; box-shadow: 0 18px 44px rgba(0, 20, 80, 0.35); }
  .card .im { height: 88px; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; }
  .card .cta { height: 22px; border-radius: 6px; background: #116dff; margin-top: 14px; }
  .c1 { left: 236px; top: 94px; transform: rotate(-2deg); }
  .c2 { left: 360px; top: 76px; transform: rotate(5deg); }
  .spark { position: absolute; color: #fff; font-size: 26px; opacity: 0.9; }
</style>
</head>
<body>
  <div class="glow g1"></div><div class="glow g2"></div>
  <div class="receipt">
    <div class="check"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <div class="bar" style="width:90%"></div><div class="bar" style="width:70%"></div><div class="bar" style="width:80%"></div>
    <div class="bar" style="width:55%;margin-top:22px"></div><div class="bar" style="width:65%"></div>
  </div>
  <div class="card c1">
    <div class="im" style="background:#eef3ff"><i data-icon="charger" data-size="54" data-color="#116dff"></i></div>
    <div class="bar" style="width:85%"></div><div class="bar" style="width:55%"></div>
    <div class="cta"></div>
  </div>
  <div class="card c2">
    <div class="im" style="background:#fff3e8"><i data-icon="case" data-size="54" data-color="#e8762c"></i></div>
    <div class="bar" style="width:80%"></div><div class="bar" style="width:60%"></div>
    <div class="cta"></div>
  </div>
  <div class="spark" style="left:226px;top:44px">✦</div>
  <div class="spark" style="left:486px;top:250px;font-size:18px">✦</div>
<script src="icons.js"></script>
</body>
</html>
