<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=block" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body.slide { flex-direction: row; align-items: center; justify-content: center; gap: 90px; }
  .copy { width: 420px; }
  .copy h1 { font-size: 46px; line-height: 1.1; font-weight: 900; margin: 0 0 20px; letter-spacing: -0.6px; }
  .copy p { font-size: 20px; line-height: 1.5; margin: 0; opacity: 0.95; }
  .phone { width: 360px; height: 746px; border-radius: 52px; background: #0b1020; padding: 14px; box-shadow: 0 30px 80px rgba(0, 20, 80, 0.45); }
  /* Real widget at a 390 x 844 phone viewport (shots/mobile.png). */
  .screen { width: 100%; height: 100%; border-radius: 40px; overflow: hidden; position: relative; }
  .screen img { display: block; width: 100%; }
</style>
</head>
<body class="slide">
  <div class="copy">
    <h1>Works on every screen</h1>
    <p>Offers adjust to any phone automatically, so mobile shoppers can buy with one tap too.</p>
  </div>
  <div class="phone"><div class="screen"><img src="../shots/mobile.png" alt=""></div></div>
</body>
</html>
