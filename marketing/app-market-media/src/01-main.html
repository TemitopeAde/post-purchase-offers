<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=block" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body.slide { flex-direction: row; align-items: center; padding: 0 0 0 84px; }
  .copy { width: 430px; flex: 0 0 auto; }
  .logo { display: block; width: 84px; height: 84px; border-radius: 22px; border: 3px solid rgba(255, 255, 255, 0.85); margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0, 20, 80, 0.3); }
  .copy h1 { font-size: 56px; line-height: 1.05; font-weight: 900; margin: 0 0 22px; letter-spacing: -1px; }
  .copy p { font-size: 22px; line-height: 1.45; margin: 0 0 34px; opacity: 0.95; }
  .chips { display: flex; flex-direction: column; gap: 12px; }
  .chips div { font-size: 18px; display: flex; align-items: center; gap: 12px; }
  .chips span { width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,0.18); display: inline-flex; align-items: center; justify-content: center; font-size: 14px; }
  /* Real offer popup, cropped from shots/thank-you.png (popup is 720 x 485 at 1x). */
  .popup { position: absolute; right: 36px; top: 50%; width: 600px; height: 404px; margin-top: -202px; border-radius: 8px; overflow: hidden; box-shadow: 0 30px 80px rgba(0, 20, 80, 0.45); transform: rotate(-1.5deg); }
  .popup img { position: absolute; width: 1067px; left: -233px; top: -156px; }
</style>
</head>
<body class="slide">
  <div class="copy">
    <img class="logo" src="icon.svg" alt="">
    <h1>Smart Post-Purchase Offers</h1>
    <p>Turn every Thank You page into a second sale with smart product recommendations.</p>
    <div class="chips">
      <div><span>✓</span>Picks products that match each order</div>
      <div><span>✓</span>Launch a campaign in minutes</div>
      <div><span>✓</span>Track revenue from every offer</div>
    </div>
  </div>
  <div class="popup"><img src="../shots/thank-you.png" alt=""></div>
</body>
</html>
