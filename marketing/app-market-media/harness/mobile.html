<html>

<title>Mobile</title>

     centered so capture.sh can center-crop it out. -->

  html, body { margin: 0; background: #fff; }
  iframe { display: block; width: 390px; height: 844px; border: 0; margin: 0 auto; }
</style>
</head>

<iframe src="./plugin.html"></iframe>
</body>
</html>
